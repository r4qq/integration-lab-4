name: Backend CI

on:
  push:


jobs:
  test:
    runs-on: ubuntu-latest
    steps:
        - uses: actions/checkout@v4

        - name: Set up Go
          uses: actions/setup-go@v5
          with:
            go-version: '1.25.9'

        - name: Install dependencies
          run: go mod download

        - name: Run linter
          run: go vet ./...

        - name: Run Tests
          run: go test -v ./...